<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>IsItLate? — ¿Cómo va tu vuelo?</title>
    <meta
      name="description"
      content="No leas letra pequeña de aerolínea. Te contamos, como lo haría un colega, lo que de verdad va a pasar con tu vuelo."
    />

    <!--
      Vista previa al compartir (WhatsApp, Telegram, X, LinkedIn...).

      %SITE_URL% lo sustituye vite.config.js al construir: los rastreadores
      exigen la dirección completa de la imagen, no una relativa. En Cloudflare
      se rellena sola con la URL del despliegue; cuando haya dominio propio, se
      pone SITE_URL a mano y manda esa.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IsItLate?" />
    <meta property="og:title" content="IsItLate? — ¿Cómo va tu vuelo?" />
    <meta
      property="og:description"
      content="Pon tu número de vuelo y te decimos, en cristiano, si vas a salir a tu hora, cuándo salir de casa y si te deben dinero."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="IsItLate? — ¿Cómo va tu vuelo?" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IsItLate? — ¿Cómo va tu vuelo?" />
    <meta
      name="twitter:description"
      content="Pon tu número de vuelo y te decimos, en cristiano, si vas a salir a tu hora, cuándo salir de casa y si te deben dinero."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <!--
      Mientras la web viva en la dirección provisional de Cloudflare, se pide
      a los buscadores que no la indexen. Si Google indexara istlate.pages.dev
      y después moviéramos el sitio a isitlate.app, acabaríamos con la
      autoridad repartida entre dos direcciones, contenido duplicado y el
      dominio provisional compitiendo contra el bueno.

      vite.config.js quita esta etiqueta sola en cuanto SITE_URL apunte a un
      dominio propio: no hay que acordarse de nada.
    -->
    %NOINDEX%
    <meta name="theme-color" content="#cfe9fb" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
